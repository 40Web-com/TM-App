name: Build and Publish TM Android Companion

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-companion/**'
      - '.github/workflows/build-android-companion.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-companion :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tm-game-companion-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tm-companion-build-${{ github.run_number }}
          name: TM Android Companion build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: android-companion/app/build/outputs/apk/debug/app-debug.apk

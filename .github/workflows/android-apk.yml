name: Build TM Android App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.js"
      - "index.html"
      - "logo.svg"
      - "style.css"
      - "auth.css"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "native-entry.js"
      - "vite.native.config.js"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: read
  actions: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Prepare bundled app assets
        run: npm run native:prepare
      - name: Build native bridge bundle
        run: npx vite build --config vite.native.config.js
      - name: Generate Android project
        run: npx cap add android
      - name: Configure native OAuth deep link
        run: node scripts/patch-android.mjs
      - name: Generate TM launcher and splash assets
        run: npx capacitor-assets generate --android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TM-App-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

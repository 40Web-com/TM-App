<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><title>Free Fire Zap | TM App</title>
<style>
:root{--bg:#10131b;--panel:#1b202c;--line:#303848;--text:#f3f5fb;--muted:#9ca8ba;--fire:#ff7a24;--gold:#ffc84a;--cyan:#60dfff;--purple:#c68aff;--green:#57d89b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:#10131bf2;border-bottom:1px solid var(--line);padding:14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0;color:var(--fire)}main{max-width:900px;margin:auto;padding:14px 14px 100px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#121722;border:1px solid var(--line);padding:13px;border-radius:12px}.stat b{font-size:23px;display:block}.coin{color:var(--gold)}.dia{color:var(--cyan)}.evo{color:var(--fire)}.rare{color:var(--purple)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{background:#131823;border:1px solid var(--line);border-radius:12px;overflow:hidden}.item img{width:100%;height:145px;object-fit:contain;background:#0d1118}.item .info{padding:10px}.item strong{display:block;font-size:14px}.muted{color:var(--muted);font-size:13px}button,input,select{font:inherit}button{border:0;border-radius:10px;background:var(--fire);color:#15100b;font-weight:700;padding:10px 13px;cursor:pointer}button.secondary{background:#252d3b;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.5}input,select{width:100%;background:#111620;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;margin:5px 0 10px}label{font-size:13px;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;overflow:auto;background:#171d28;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}nav button{flex:1;min-width:65px;padding:9px 4px;font-size:12px;background:transparent;color:var(--muted)}nav button.active{background:var(--fire);color:#111}.tag{font-size:12px;border:1px solid var(--line);border-radius:30px;padding:3px 8px;color:var(--muted)}#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:white;color:#111;padding:10px 15px;border-radius:10px;display:none;z-index:9}.loading{text-align:center;padding:30px;color:var(--muted)}@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}.items{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><header><h1>FREE FIRE <span style="color:white">ZAP</span></h1><span class="tag">TM integrated</span></header><main id="app"><div class="loading">Connecting to TM…</div></main><nav id="nav"></nav><div id="toast"></div>
<script>
const API="https://swfawduoosskffbuniks.supabase.co/functions/v1/free-fire-spin",KEY="sb_publishable_rkR-lAksyaDc9dNU4fgkZg_MNoN5RGb",session=localStorage.getItem("tm_session")||"",app=document.querySelector("#app"),nav=document.querySelector("#nav");
let status={},uidLink=null,tab="home",category="Evo Guns",items=[],claims=[],admin=false,busy=false;
const cats=["TM Spin Coins","Diamonds","Emotes","Evo Guns","Gloo Wall","Gun Skins","Bundles & Outfits","Finishing Moves","Backpacks","Character Skins","Parachutes & Boards","Grenade Skins","Vouchers & Tokens","Pets","Vehicles","Loot Crates","Lobby Items","Settings & UI","Avatar & Frames","Banners & Profile","Loading Screens","Kill Effects","Kill Notifications","Collection Items","Guild Items","Rare Items","Other Rare Items"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(s){let t=document.querySelector("#toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2500)}
async function call(action,p={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+KEY},body:JSON.stringify({action,session_token:session,...p})});const d=await r.json().catch(()=>({error:"Server response error"}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function load(){try{if(!session)throw Error("Please sign in to TM App first.");const [s,l]=await Promise.all([call("status"),call("linked_uid")]);status=s;uidLink=l.link;admin=!!s.is_admin;claims=s.claims||[];render();}catch(e){app.innerHTML='<section class="card"><h2>TM account connection required</h2><p class="muted">'+esc(e.message)+'</p><p>Sign into TM App, then reopen Free Fire Zap.</p></section>';nav.innerHTML="";}}
function navView(){const tabs=[["home","Dashboard"],["catalog","Catalog"],["claims","Rewards"],...(admin?[["admin","ADMINhub"]]:[])];nav.innerHTML=tabs.map(([k,l])=>'<button class="'+(tab===k?"active":"")+'" data-tab="'+k+'">'+l+'</button>').join("");}
function dashboard(){return '<section class="card"><div class="row"><div><h2 style="margin:0">Free Fire Zap</h2><div class="muted">'+(uidLink?esc(uidLink.free_fire_nickname||"Player")+" • UID "+esc(uidLink.free_fire_uid):"Link your Free Fire UID")+'</div></div><span class="tag">TM wallet</span></div>'+(uidLink?'':'<label>Free Fire UID</label><input id="uid" inputmode="numeric" placeholder="Enter your Free Fire UID"><button onclick="linkUid()">Confirm UID</button>')+'</section><div class="stats"><div class="stat coin">TM Coins<b>'+Number(status.coin_balance||0).toLocaleString()+'</b></div><div class="stat dia">Diamonds<b>'+Number(status.diamond_balance||0).toLocaleString()+'</b></div><div class="stat evo">Evo Guns<b>Gifted rewards</b></div><div class="stat rare">Rare Items<b>'+claims.length+'</b></div></div><section class="card" style="margin-top:12px"><div class="row"><div><h3>Weekly Diamond reward</h3><p class="muted">Eligible weekly bonus is handled by TM server.</p></div><button class="secondary" onclick="checkin()">Daily check-in</button></div></section><section class="card"><h3>Claimed / gifted rewards</h3>'+claimRows(claims)+'</section>'}
function claimRows(arr){return arr.length?arr.map(c=>'<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><b>'+esc(c.reward_item)+'</b><div class="muted">'+new Date(c.created_at).toLocaleDateString()+'</div></div><span class="tag">'+esc(c.status)+'</span></div>').join(""):'<p class="muted">No gifts yet. Admin gifts will appear here.</p>'}
async function catalog(){return '<section class="card"><h2>Catalog</h2><p class="muted">Browse actual items from TM’s shared Free Fire catalog (34k+ entries).</p><label>Category</label><select id="cat" onchange="loadCatalog()">'+cats.map(c=>'<option '+(c===category?'selected':'')+'>'+esc(c)+'</option>').join("")+'</select><div id="catalog-items" class="loading">Loading item catalog…</div></section>'}
async function loadCatalog(){category=document.querySelector("#cat")?.value||category;let holder=document.querySelector("#catalog-items");if(!holder)return;holder.innerHTML="Loading catalog…";try{const d=await call("inventory_list",{category,offset:0,limit:60});items=d.items||[];holder.innerHTML='<div class="items">'+items.map(i=>'<div class="item">'+(i.image_url?'<img loading="lazy" src="'+esc(i.image_url)+'" alt="'+esc(i.item_name)+'">':'<div style="height:145px;display:grid;place-items:center;color:var(--fire)">FREE FIRE</div>')+'<div class="info"><strong>'+esc(i.item_name)+'</strong><span class="muted">'+esc(i.rarity||category)+'</span></div></div>').join("")+'</div><p class="muted">Showing '+items.length+' / '+d.total+'</p>';}catch(e){holder.innerHTML='<p class="bad">'+esc(e.message)+'</p>'}}
function rewardView(){return '<section class="card"><h2>My reward claims</h2><p class="muted">Rewards gifted by TM Admin will show here. Delivery is handled manually to your Free Fire UID.</p>'+claimRows(claims)+'</section>'}
function adminView(){return '<section class="card"><h2>ADMINhub · Gift player</h2><p class="muted">Send a real gift to a UID already linked to a TM account. User gets a notification.</p><label>Free Fire UID</label><input id="giftuid" inputmode="numeric" placeholder="Player UID"><label>Gift item / reward</label><input id="giftname" placeholder="e.g. Blue Flame Dragon AK / 400 Diamonds"><label>Image URL (optional)</label><input id="giftimg" placeholder="https://…"><button onclick="gift()">Send gift</button></section><section class="card"><h3>Recent claims</h3><div id="adminclaims">Loading…</div></section>'}
function render(){navView();app.innerHTML=tab==="home"?dashboard():tab==="catalog"?"<section class='card'><h2>Catalog</h2><label>Category</label><select id='cat' onchange='loadCatalog()'>"+cats.map(c=>'<option '+(c===category?'selected':'')+'>'+esc(c)+'</option>').join("")+"</select><div id='catalog-items'>Loading…</div></section>":tab==="claims"?rewardView():adminView();if(tab==="catalog")loadCatalog();if(tab==="admin")loadAdminClaims();}
async function linkUid(){try{const uid=document.querySelector("#uid").value.trim();if(!/^\\d{5,15}$/.test(uid))throw Error("Enter a numeric UID (5–15 digits).");const r=await call("link_uid",{uid});uidLink=r.link;toast("UID confirmed and linked");await load()}catch(e){toast(e.message)}}
async function checkin(){try{await call("checkin");toast("Check-in recorded");await load()}catch(e){toast(e.message)}}
async function gift(){try{const uid=document.querySelector("#giftuid").value.trim(),item_name=document.querySelector("#giftname").value.trim(),image_url=document.querySelector("#giftimg").value.trim();await call("admin_gift",{uid,item_name,image_url});toast("Gift sent and notification created");document.querySelector("#giftname").value="";await loadAdminClaims()}catch(e){toast(e.message)}}
async function loadAdminClaims(){const el=document.querySelector("#adminclaims");if(!el)return;try{const d=await call("admin_claims");el.innerHTML=claimRows(d.claims||[])}catch(e){el.innerHTML=esc(e.message)}}
nav.addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;render()}});
load();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><title>Free Fire Zap | TM App</title>
<style>
:root{--bg:#090d14;--panel:rgba(17,23,34,.91);--line:rgba(255,255,255,.13);--text:#f7f8fc;--muted:#aab4c5;--fire:#ff7626;--gold:#ffd25c;--cyan:#70e7ff;--purple:#c9a0ff;--green:#6cf0a5}
*{box-sizing:border-box}body{margin:0;background:#090d14;color:var(--text);font:15px Inter,system-ui,-apple-system,sans-serif;background-image:linear-gradient(90deg,rgba(6,9,14,.96) 0%,rgba(6,9,14,.86) 48%,rgba(6,9,14,.48) 100%),url("https://www.10wallpaper.com/wallpaper/1920x1440/2101/Kelly_Garena_Free_Fire_2021_Game_HD_Poster_1920x1440.jpg");background-size:cover;background-position:center top;background-attachment:fixed}
header{position:sticky;top:0;z-index:5;background:rgba(7,10,16,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:125px;max-width:36vw;object-fit:contain}.brand small{display:block;color:var(--fire);font-weight:800;letter-spacing:2px;font-size:10px}
main{max-width:1100px;margin:auto;padding:16px 14px 105px;min-height:80vh}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px;backdrop-filter:blur(12px);box-shadow:0 12px 35px #0003}.hero{min-height:240px;display:flex;align-items:flex-end;position:relative;overflow:hidden;background:linear-gradient(90deg,#0a0d14f5,#0a0d1480),url("https://www.10wallpaper.com/wallpaper/1920x1440/2101/Kelly_Garena_Free_Fire_2021_Game_HD_Poster_1920x1440.jpg") center 30%/cover;border:1px solid #ff76265c}.hero h2{font-size:clamp(28px,6vw,46px);margin:5px 0;color:white;letter-spacing:-1px}.hero p{color:#d6dbe4;max-width:500px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:900;color:var(--fire);text-transform:uppercase}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:rgba(12,16,24,.88);border:1px solid var(--line);padding:14px;border-radius:14px}.stat b{font-size:25px;display:block;margin-top:5px}.coin{color:var(--gold)}.dia{color:var(--cyan)}.evo{color:var(--fire)}.rare{color:var(--purple)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{background:#101620;border:1px solid var(--line);border-radius:12px;overflow:hidden}.item img{width:100%;height:145px;object-fit:contain;background:#0d1118}.item .info{padding:10px}.item{cursor:pointer}.detailMask{position:fixed;inset:0;background:#02050bdc;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}.detailRoom{width:min(680px,100%);max-height:92vh;overflow:auto;background:#111925;border:1px solid #ff76266b;border-radius:18px;padding:16px}.detailRoom img{width:100%;height:220px;object-fit:contain;background:#080d14;border-radius:12px}.detailStats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.detailStats div{background:#0b111a;border:1px solid var(--line);border-radius:10px;padding:10px}.detailStats b{display:block;color:var(--gold);margin-top:4px}.item strong{display:block;font-size:14px}.muted{color:var(--muted);font-size:13px}button,input,select{font:inherit}button{border:0;border-radius:11px;background:linear-gradient(135deg,#ff8a31,#ff5b16);color:#16100a;font-weight:800;padding:12px 16px;cursor:pointer;box-shadow:0 5px 18px #ff6a1b25}button.secondary{background:#242c3a;color:var(--text);border:1px solid var(--line);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed}input,select{width:100%;background:#0b111a;border:1px solid #3a4659;color:var(--text);border-radius:11px;padding:13px;margin:6px 0 12px}label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px}.tag{font-size:11px;border:1px solid var(--line);border-radius:30px;padding:5px 9px;color:var(--muted);background:#ffffff08}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{width:100%;min-height:65px}.entry{max-width:460px;margin:7vh auto 0;text-align:left}.entryLogo{width:180px;display:block;margin:0 auto 16px}.entry .card{padding:23px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.sectionTitle h3{margin:0}nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;overflow:auto;background:rgba(10,14,21,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:7}nav button{flex:1;min-width:65px;padding:10px 4px;font-size:12px;background:transparent;color:var(--muted);box-shadow:none}nav button.active{background:var(--fire);color:#111}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:white;color:#111;padding:11px 16px;border-radius:10px;display:none;z-index:9;max-width:90vw}.loading{text-align:center;padding:30px;color:var(--muted)}@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}.items{grid-template-columns:repeat(4,minmax(0,1fr))}.quick{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><div class="brand"><img src="https://freefiremobile-a.akamaihd.net/common/web_event/official2.ff.garena.all/img/20228/ebcec94a33d37c7b957e8a795240f732.jpg" alt="Free Fire logo"><div><small>TM APP PRESENTS</small><b>FREE FIRE ZAP</b></div></div><span class="tag">🔥 PLAYER ROOM</span></header><main id="app"><div class="loading">Connecting to TM…</div></main><nav id="nav"></nav><div id="toast" class="toast"></div>
<script>
const API="https://swfawduoosskffbuniks.supabase.co/functions/v1/free-fire-spin",KEY="sb_publishable_rkR-lAksyaDc9dNU4fgkZg_MNoN5RGb",session=localStorage.getItem("tm_session")||"",app=document.querySelector("#app"),nav=document.querySelector("#nav");
let status={},uidLink=null,tab="home",category="Evo Guns",items=[],claims=[],admin=false,busy=false,playerUID=localStorage.getItem("ffzap_uid")||"",uidWallet={coin_balance:0,diamond_balance:0,checked_in_today:false,weekly_bonus_claimed:false},zapWallet={balance_kobo:0,balance_naira:0};
const cats=["TM Spin Coins","Diamonds","Emotes","Evo Guns","Gloo Wall","Gun Skins","Bundles & Outfits","Finishing Moves","Backpacks","Character Skins","Parachutes & Boards","Grenade Skins","Vouchers & Tokens","Pets","Vehicles","Loot Crates","Lobby Items","Settings & UI","Avatar & Frames","Banners & Profile","Loading Screens","Kill Effects","Kill Notifications","Collection Items","Guild Items","Rare Items","Other Rare Items"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(s){let t=document.querySelector("#toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2500)}
async function call(action,p={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+KEY},body:JSON.stringify({action,session_token:session,...p})});const d=await r.json().catch(()=>({error:"Server response error"}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function load(){if(!playerUID){renderEntry();return;}try{uidWallet=await call("uid_status",{uid:playerUID});zapWallet=await call("zap_wallet_status",{uid:playerUID});render();}catch(e){app.innerHTML='<section class="card"><h2>Unable to open player room</h2><p>'+esc(e.message)+'</p><button onclick="renderEntry()">Change UID</button></section>';nav.innerHTML="";}}
function renderEntry(){app.innerHTML='<section class="entry"><div class="card"><img class="entryLogo" src="https://freefiremobile-a.akamaihd.net/common/web_event/official2.ff.garena.all/img/20228/ebcec94a33d37c7b957e8a795240f732.jpg"><div class="eyebrow">Free Fire Player Access</div><h2 style="font-size:30px;margin:8px 0">Enter the battlefield</h2><p class="muted">Enter your Free Fire UID to open your player room. No player lookup or verification.</p><label>YOUR FREE FIRE UID</label><input id="entryuid" placeholder="e.g. 16507737547" autocomplete="off"><button style="width:100%" onclick="enterRoom()">Open Player Room →</button><p class="muted">Your UID is used to save your daily rewards and wallet.</p></div></section>';nav.innerHTML="";}
async function enterRoom(){const uid=document.querySelector("#entryuid")?.value.trim();if(!uid){toast("Enter your Free Fire UID first");return;}playerUID=uid;localStorage.setItem("ffzap_uid",uid);await load();}
function navView(){const tabs=[["home","🏠 Home"],["spin","🎁 Spin Room"],["catalog","🧰 Catalog"],["claims","🏆 Rewards"]];nav.innerHTML=tabs.map(([k,l])=>'<button class="'+(tab===k?"active":"")+'" data-tab="'+k+'">'+l+'</button>').join("")+'<button data-tab="uid">UID</button>';}
function dashboard(){return '<section class="card hero"><div><div class="eyebrow">PLAYER ROOM • UID '+esc(playerUID)+'</div><h2>Welcome to<br>Free Fire Zap</h2><p>Daily rewards, spin prizes, diamonds and rare Free Fire items — all in one room.</p><span class="tag">Kelly • Battle in Style</span></div></section><div class="stats"><div class="stat coin">🔥 FF Coins<b>'+Number(uidWallet.coin_balance||0).toLocaleString()+'</b><small class="muted">Daily coin top-up</small></div><div class="stat dia">💎 Diamonds<b>'+Number(uidWallet.diamond_balance||0).toLocaleString()+'</b><small class="muted">Weekly +400 reward</small></div><div class="stat evo">🎁 Daily Bonus<b>'+(uidWallet.checked_in_today?'Claimed':'Ready')+'</b></div><div class="stat rare">🏆 Weekly Bonus<b>'+(uidWallet.weekly_bonus_claimed?'Claimed':'Available')+'</b></div></div><section class="card"><div class="sectionTitle"><h3>Free Fire Zap Cash Wallet</h3><span class="tag">Real-money top-ups</span></div><div class="stat coin"><small>Wallet balance</small><b>₦'+Number(zapWallet.balance_naira||0).toLocaleString()+'</b></div><p class="muted">Top up from ₦800 minimum. Catalog prices and purchases are available after funding.</p><label>Top-up amount (₦)</label><input id="zapamount" type="number" inputmode="numeric" min="800" step="100" value="800"><label>Email for Paystack receipt</label><input id="zapemail" type="email" placeholder="you@example.com"><button onclick="topup()">Top Up Wallet →</button></section><section class="card"><div class="sectionTitle"><h3>Daily reward station</h3><span class="tag">100 FF Coins / day</span></div><p class="muted">Check in once per day to receive Free Fire coins. The first check-in each week also adds 400 diamonds.</p><button '+(uidWallet.checked_in_today?'disabled':'')+' onclick="checkin()"> '+(uidWallet.checked_in_today?'✓ Daily check-in complete':'Claim daily coins + weekly diamonds')+'</button></section><section class="card"><div class="sectionTitle"><h3>Quick access</h3><span class="tag">Explore room</span></div><div class="quick"><button onclick="goTab(\'spin\')">🎰 Spin Room</button><button class="secondary" onclick="goTab(\'catalog\')">🧰 Item Catalog</button><button class="secondary" onclick="goTab(\'claims\')">🏆 My Rewards</button><button class="secondary" onclick="changeUid()">🔁 Change UID</button></div></section>'}
function spinRoom(){return '<section class="card hero"><div><div class="eyebrow">LUCKY DROP</div><h2>Spin Room</h2><p>Choose your prize category and discover Free Fire rewards.</p></div></section><section class="card"><label>Choose prize category</label><select id="spincat">'+cats.map(c=>'<option>'+esc(c)+'</option>').join('')+'</select><p class="muted">Reward animation and spin settlement are currently connected to the TM account spin backend; UID-only spins are not yet available.</p><button onclick="toast(\'UID spin endpoint is not connected yet\')">Enter Spin Room</button></section>'}
function claimRows(arr){return arr.length?arr.map(c=>'<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><b>'+esc(c.reward_item)+'</b><div class="muted">'+new Date(c.created_at).toLocaleDateString()+'</div></div><span class="tag">'+esc(c.status)+'</span></div>').join(""):'<p class="muted">No gifts yet. Admin gifts will appear here.</p>'}
async function catalog(){return '<section class="card"><h2>Catalog</h2><p class="muted">Browse actual items from TM’s shared Free Fire catalog (34k+ entries).</p><label>Category</label><select id="cat" onchange="loadCatalog()">'+cats.map(c=>'<option '+(c===category?'selected':'')+'>'+esc(c)+'</option>').join("")+'</select><div id="catalog-items" class="loading">Loading item catalog…</div></section>'}
async function loadCatalog(){category=document.querySelector("#cat")?.value||category;let holder=document.querySelector("#catalog-items");if(!holder)return;holder.innerHTML="Loading catalog…";try{const d=await call("inventory_list",{category,offset:0,limit:60});items=d.items||[];holder.innerHTML='<div class="items">'+items.map((i,n)=>'<div class="item" onclick="openItem('+n+')">'+(i.image_url?'<img loading="lazy" src="'+esc(i.image_url)+'" alt="'+esc(i.item_name)+'">':'<div style="height:145px;display:grid;place-items:center;color:var(--fire)">FREE FIRE</div>')+'<div class="info"><strong>'+esc(i.item_name)+'</strong><span class="muted">'+esc(i.rarity||category)+'</span><button style="width:100%;margin-top:9px" onclick="event.stopPropagation();openItem('+n+')">View details / Buy</button></div></div>').join("")+'</div><p class="muted">Showing '+items.length+' / '+d.total+'</p>';}catch(e){holder.innerHTML='<p class="bad">'+esc(e.message)+'</p>'}}
function itemPrice(i){let cat=String(i.category||category).toLowerCase(),rar=String(i.rarity||"").toLowerCase(),nm=String(i.item_name||"").toLowerCase();if(cat.includes("evo")||nm.includes("evo"))return 12000;if(cat.includes("rare")||rar.includes("legend"))return 5000;if(rar.includes("epic"))return 3500;if(rar.includes("rare"))return 2500;if(cat.includes("diamond"))return 800;if(cat.includes("gun")||cat.includes("skin"))return 2000;return 1500;}
function weaponStats(i){let nm=String(i.item_name||"").toLowerCase(),s={"Damage":"★★★☆☆","Rate of Fire":"★★★☆☆","Accuracy":"★★★☆☆","Range":"★★★☆☆","Reload Speed":"★★★☆☆","Movement Speed":"★★★☆☆","Magazine":"★★★☆☆"};if(/ak|m14|scar|groza|woodpecker/.test(nm)){s.Damage="★★★★☆";s.Range="★★★★☆";}else if(/mp40|vector|thompson|ump|mac10/.test(nm)){s["Rate of Fire"]="★★★★★";s["Movement Speed"]="★★★★☆";s.Range="★★☆☆☆";}else if(/awm|kar98|m82|sniper/.test(nm)){s.Damage="★★★★★";s.Range="★★★★★";s["Rate of Fire"]="★☆☆☆☆";}return s;}
function openItem(n){let i=items[n];if(!i)return;let p=itemPrice(i),stats=weaponStats(i),gun=/gun|evo/i.test(String(i.category||category)),funded=Number(zapWallet.balance_kobo||0)>=80000;let mask=document.createElement("div");mask.className="detailMask";mask.id="item-detail-mask";mask.onclick=e=>{if(e.target===mask)mask.remove()};mask.innerHTML='<div class="detailRoom"><div class="row"><span class="eyebrow">ITEM DETAILS</span><button class="secondary" onclick="document.getElementById(\'item-detail-mask\').remove()">Close ✕</button></div>'+(i.image_url?'<img src="'+esc(i.image_url)+'">':'')+'<h2>'+esc(i.item_name)+'</h2><p class="muted">'+esc(i.rarity||category)+' · '+esc(i.category||category)+'</p><h3>Prize & details</h3><p>'+esc(i.item_name)+' is listed in Free Fire Zap. Price is shown after wallet funding.</p>'+(gun?'<h3>Weapon performance ratings</h3><p class="muted">General weapon-class ratings only; not official skin-specific Garena modifiers.</p><div class="detailStats">'+Object.entries(stats).map(([k,v])=>'<div>'+k+'<b>'+v+'</b></div>').join("")+'</div>':'')+'<section class="card"><h3>TM price</h3><h2>'+(funded?'₦'+p.toLocaleString():'🔒 Locked until wallet top-up')+'</h2><button style="width:100%" onclick="buyItem('+n+')">'+(funded?'Buy item →':'Top up wallet to unlock price')+'</button></section></div>';document.body.appendChild(mask);}
function buyItem(n){let i=items[n];if(!i)return;let p=itemPrice(i);if(Number(zapWallet.balance_kobo||0)<p*100){toast('Please top up your wallet first (minimum ₦800).');document.getElementById('item-detail-mask')?.remove();goTab('home');return;}let txt='Hello TM Free Fire Zap, I want to order '+i.item_name+' for ₦'+p+'. Free Fire UID: '+playerUID+'. Please confirm delivery.';window.open('https://wa.me/2349041259863?text='+encodeURIComponent(txt),'_blank');}
function rewardView(){return '<section class="card"><h2>My reward claims</h2><p class="muted">Rewards gifted by TM Admin will show here. Delivery is handled manually to your Free Fire UID.</p>'+claimRows(claims)+'</section>'}
function adminView(){return '<section class="card"><h2>ADMINhub · Gift player</h2><p class="muted">Send a real gift to a UID already linked to a TM account. User gets a notification.</p><label>Free Fire UID</label><input id="giftuid" inputmode="numeric" placeholder="Player UID"><label>Gift item / reward</label><input id="giftname" placeholder="e.g. Blue Flame Dragon AK / 400 Diamonds"><label>Image URL (optional)</label><input id="giftimg" placeholder="https://…"><button onclick="gift()">Send gift</button></section><section class="card"><h3>Recent claims</h3><div id="adminclaims">Loading…</div></section>'}
function render(){navView();app.innerHTML=tab==="home"?dashboard():tab==="spin"?spinRoom():tab==="catalog"?"<section class='card'><h2>Free Fire Item Catalog</h2><label>Category</label><select id='cat' onchange='loadCatalog()'>"+cats.map(c=>'<option '+(c===category?'selected':'')+'>'+esc(c)+'</option>').join("")+"</select><div id='catalog-items'>Loading…</div></section>":tab==="claims"?rewardView():'<section class="card"><h2>Player UID</h2><p>'+esc(playerUID)+'</p><button onclick="changeUid()">Change UID</button></section>';if(tab==="catalog")loadCatalog();}
function goTab(t){tab=t;render()}function changeUid(){playerUID="";localStorage.removeItem("ffzap_uid");renderEntry();}
async function linkUid(){await enterRoom()}
async function topup(){if(busy)return;const amount=Number(document.querySelector("#zapamount")?.value),email=document.querySelector("#zapemail")?.value.trim();if(!Number.isInteger(amount)||amount<800){toast("Minimum top-up is ₦800");return;}if(!email){toast("Enter your email for Paystack");return;}busy=true;try{const r=await call("zap_topup_initialize",{uid:playerUID,amount,email});window.location.href=r.authorization_url;}catch(e){toast(e.message)}finally{busy=false;}}
async function verifyPaystackReturn(){const q=new URLSearchParams(location.search);if(q.get("pay_verify")!=="1")return;const ref=q.get("reference");history.replaceState({},document.title,location.pathname);if(!ref||!playerUID)return;app.innerHTML='<div class="loading">Verifying your Paystack payment…</div>';try{const r=await call("zap_topup_verify",{uid:playerUID,reference:ref});zapWallet=await call("zap_wallet_status",{uid:playerUID});toast(r.already_credited?"Payment already credited":"Payment successful — wallet credited");tab="home";render();}catch(e){app.innerHTML='<section class="card"><h2>Payment verification</h2><p>'+esc(e.message)+'</p><button onclick="load()">Return to Free Fire Zap</button></section>';}}
async function checkin(){try{const r=await call("uid_checkin",{uid:playerUID});uidWallet=await call("uid_status",{uid:playerUID});toast(r.already_checked_in?"Today's reward already claimed":("Claimed +"+r.coin_reward+" FF Coins"+(r.diamond_reward? " and +"+r.diamond_reward+" Diamonds":"")));render();}catch(e){toast(e.message)}}
async function gift(){try{const uid=document.querySelector("#giftuid").value.trim(),item_name=document.querySelector("#giftname").value.trim(),image_url=document.querySelector("#giftimg").value.trim();await call("admin_gift",{uid,item_name,image_url});toast("Gift sent and notification created");document.querySelector("#giftname").value="";await loadAdminClaims()}catch(e){toast(e.message)}}
async function loadAdminClaims(){const el=document.querySelector("#adminclaims");if(!el)return;try{const d=await call("admin_claims");el.innerHTML=claimRows(d.claims||[])}catch(e){el.innerHTML=esc(e.message)}}
nav.addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){if(b.dataset.tab==="uid"){changeUid();return;}tab=b.dataset.tab;render()}});
load();verifyPaystackReturn();
</script></body></html>
